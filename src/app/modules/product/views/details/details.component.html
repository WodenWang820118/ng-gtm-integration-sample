<div
  id="content-{{ (destination$ | async)?.title?.toLowerCase() }}"
  class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8"
>
  <div class="mb-6 border-b pb-4">
    <h2>
      {{ (destination$ | async)?.title }}
      <small style="font-size: 18px">{{
        (destination$ | async)?.smallTitle
      }}</small>
      <br />
      <a
        class="all-destinations rwd-all-destinations"
        (click)="navigateToDestinations()"
        >All Destinations</a
      >
    </h2>
  </div>
  <div class="flex flex-col lg:flex-row space-y-6 lg:space-y-0 lg:space-x-6">
    <div class="flex-1 p-4 bg-white rounded-lg shadow">
      <h3>Go to {{ (destination$ | async)?.title }}</h3>
      <div style="height: 66%">
        <p>
          {{ (destination$ | async)?.description }}
        </p>
      </div>
      <div class="mt-4">
        <h4 class="text-xl font-semibold mb-2">
          ${{ (destination$ | async)?.price }} / 6 Nights
        </h4>
        <div class="flex justify-end items-center space-x-2">
          <!-- Replace select with PrimeNG AutoComplete -->
          <p-autoComplete
            [formControl]="numberOfPersonsControl"
            [suggestions]="filteredPersons"
            (completeMethod)="filterPersons($event)"
            field="label"
            dropdown="true"
            [forceSelection]="true"
            placeholder="Select persons"
            class="w-auto"
          ></p-autoComplete>
          <button
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded"
            data-name="{{ (destination$ | async)?.title }}"
            (click)="addToCart(destination$)"
          >
            Add to Cart
          </button>
        </div>
      </div>
    </div>
    <div class="flex-1 p-4">
      <!-- Main image -->
      <div class="flex justify-center mb-4">
        <div class="overflow-hidden rounded-lg">
          <img
            src="{{
              (destination$ | async)?.imageBig
                ? (destination$ | async)?.imageBig
                : '../../../../../../../assets/images/placeholder.png'
            }}"
            alt=""
            class="w-full h-auto object-cover"
          />
        </div>
      </div>
  <!-- Responsive additional images -->
  @if (( (windowSizeService.width$ | async) ?? 0 ) > 480) {
        <div class="flex justify-center space-x-4">
          <div class="overflow-hidden rounded-lg">
            <img
              src="{{ (destination$ | async)?.image2
                ? (destination$ | async)?.image2
                : '../../../../../../../assets/images/placeholder.png' }}"
              alt=""
              class="w-32 h-32 object-cover"
            />
          </div>
          <div class="overflow-hidden rounded-lg">
            <img
              src="{{ (destination$ | async)?.image3
                ? (destination$ | async)?.image3
                : '../../../../../../../assets/images/placeholder.png' }}"
              alt=""
              class="w-32 h-32 object-cover"
            />
          </div>
        </div>
  } @else {
        <div class="flex justify-center">
          <!-- mobile placeholder or carousel could go here -->
        </div>
      }
    </div>
  </div>
</div>
